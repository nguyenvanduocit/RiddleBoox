<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f1efe9;
    --ink: #111310;
    --muted: #686a62;
    --tomato: #ef674b;
    --serif: "Fraunces", Georgia, serif;
    --sans: "DM Sans", sans-serif;
    --mono: "DM Mono", monospace;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px;
    background: var(--paper);
    overflow: hidden;
    position: relative;
    font-family: var(--sans);
  }
  /* cùng texture giấy với landing (styles.css) */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    opacity: .18;
  }
  .wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 44px;
  }
  .brand-mark {
    position: relative;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: var(--ink);
    flex: none;
    overflow: hidden;
  }
  /* 270 = 180 * 108/72: mô phỏng đúng mask của adaptive icon */
  .brand-mark img {
    position: absolute;
    width: 270px; height: 270px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  .text { position: relative; }
  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 14px;
    color: var(--muted);
    font: 500 15px var(--mono);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .eyebrow-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--tomato);
    box-shadow: 0 0 0 5px rgba(239,103,75,.12);
  }
  h1 {
    margin: 0;
    color: var(--ink);
    font-family: var(--serif);
    font-weight: 500;
    font-size: 92px;
    letter-spacing: -.04em;
    line-height: 1;
  }
  h1 span { color: var(--tomato); }
  .tagline {
    margin: 18px 0 0 4px;
    color: var(--muted);
    font-size: 27px;
    line-height: 1.4;
  }
  .tagline em { color: var(--ink); font-style: italic; font-family: var(--serif); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-mark"><img src="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"></div>
    <div class="text">
      <p class="eyebrow"><span class="eyebrow-dot"></span>BOOX &middot; ANDROID</p>
      <h1>Riddle<span>Boox</span></h1>
      <p class="tagline">An AI agent that <em>lives inside your BOOX.</em></p>
    </div>
  </div>
</body>
</html>
